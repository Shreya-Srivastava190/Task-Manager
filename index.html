<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    .js-container {
      width: 400px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .input-section {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    .add-btn {
      padding: 10px 15px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .add-btn:hover {
      background-color: #43a047;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background-color: #fafafa;
    }

    .task-text {
      font-size: 15px;
    }

    .completed {
      text-decoration: line-through;
      color: gray;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .done-btn,
    .delete-btn {
      border: none;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }

    .done-btn {
      background-color: #2196f3;
    }

    .delete-btn {
      background-color: #f44336;
    }

  </style>
</head>

<body>

  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/babel.js"></script>

  <script type="text/babel">

   function TodoApp() {

  const [addTask, setAddTask] = React.useState("");
  const [tasks, setTasks] = React.useState([]);
  const [i, setEditIndex] = React.useState(null);
  const [e, setEditTask] = React.useState("");

  function edit(indexToEdit) {
    setEditIndex(indexToEdit);
    setEditTask(tasks[indexToEdit].text);
  }

  function save() {

    const updatedTasks = tasks.map((task, index) => {

      if (index === i) {
        return {
          ...task,
          text: e
        };
      }

      return task;

    });

    setTasks(updatedTasks);
    setEditIndex(null);

  }

  function add() {

    if (addTask.trim() === "") {
      return;
    }

    setTasks([
      ...tasks,
      {
        text: addTask,
        completed: false
      }
    ]);

    setAddTask("");
  }

  function del(indexToDelete) {

    const updatedTasks = tasks.filter((task, index) => {
      return index !== indexToDelete;
    });

    setTasks(updatedTasks);
  }

  function toggleComplete(indexToToggle) {

    const updatedTasks = tasks.map((task, index) => {

      if (index === indexToToggle) {

        return {
          ...task,
          completed: !task.completed
        };

      }

      return task;

    });

    setTasks(updatedTasks);
  }

  return (
    <>

      <h1>Todo App</h1>

      <div className="input-section">

        <input
          placeholder="Enter Task"
          value={addTask}
          onChange={(event) => {
            setAddTask(event.target.value);
          }}
        />

        <button
          className="add-btn"
          onClick={add}
        >
          Add
        </button>

      </div>

      <div>

        {tasks.map((task, index) => {

          return (

            <div className="task-item" key={index}>

              {
                index === i ? (

                  <input
                    value={e}
                    onChange={(event) => {
                      setEditTask(event.target.value);
                    }}
                  />

                ) : (

                  <span
                    className={
                      task.completed
                        ? "task-text completed"
                        : "task-text"
                    }
                  >
                    {task.text}
                  </span>

                )
              }

              <div className="btn-group">

                <button
                  className="done-btn"
                  onClick={() => toggleComplete(index)}
                >
                  {task.completed ? "Undo" : "Done"}
                </button>

                <button
                  className="delete-btn"
                  onClick={() => del(index)}
                >
                  Delete
                </button>

                {
                  index === i ? (

                    <button onClick={save}>
                      <img src="images.png" height="30"width="40"></img>
                    </button>

                  ) : (

                    <button onClick={() => edit(index)}>
                      <img src="edit.png"height="30" width="40"></img>
                    </button>

                  )
                }

              </div>

            </div>

          );

        })}

      </div>

    </>
  );
}

const container = document.querySelector(".js-container");

ReactDOM.createRoot(container).render(<TodoApp />);
  </script>

</body>
</html>
