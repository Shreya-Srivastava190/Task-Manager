<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    .js-container {
      width: 420px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    .add-btn {
      padding: 10px 15px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .completed {
      text-decoration: line-through;
      color: gray;
    }

    .btn-group {
      display: flex;
      gap: 5px;
    }

    button {
      cursor: pointer;
      border: none;
      padding: 6px 8px;
      border-radius: 5px;
    }

    .done-btn { background: #2196f3; color: white; }
    .delete-btn { background: #f44336; color: white; }
  </style>
</head>

<body>

<div class="js-container"></div>

<script src="https://unpkg.com/supersimpledev/react.js"></script>
<script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
<script src="https://unpkg.com/supersimpledev/babel.js"></script>

<script type="text/babel">

function TodoApp() {

  const [addTask, setAddTask] = React.useState("");
  const [tasks, setTasks] = React.useState(() => {
    const saved = localStorage.getItem("tasks");
    return saved ? JSON.parse(saved) : [];
  });

  const [i, setEditIndex] = React.useState(null);
  const [e, setEditTask] = React.useState("");
  const [search, setSearch] = React.useState("");
  const [filter, setFilter] = React.useState("all");

  React.useEffect(() => {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }, [tasks]);

  function add() {
    if (addTask.trim() === "") return;

    setTasks([
      ...tasks,
      { text: addTask, completed: false }
    ]);

    setAddTask("");
  }

  function del(indexToDelete) {
    setTasks(tasks.filter((_, index) => index !== indexToDelete));
  }

  function toggleComplete(indexToToggle) {
    const updated = tasks.map((task, index) => {
      if (index === indexToToggle) {
        return { ...task, completed: !task.completed };
      }
      return task;
    });

    setTasks(updated);
  }

  function edit(indexToEdit) {
    setEditIndex(indexToEdit);
    setEditTask(tasks[indexToEdit].text);
  }

  function save() {
    const updated = tasks.map((task, index) => {
      if (index === i) {
        return { ...task, text: e };
      }
      return task;
    });

    setTasks(updated);
    setEditIndex(null);
  }

  const filteredTasks = tasks
    .filter((task) =>
      task.text.toLowerCase().includes(search.toLowerCase())
    )
    .filter((task) => {
      if (filter === "active") return !task.completed;
      if (filter === "completed") return task.completed;
      return true;
    });

  return (
    <>
      <h1>Todo App</h1>

      {/* ADD */}
      <div className="input-section">
        <input
          placeholder="Enter Task"
          value={addTask}
          onChange={(e) => setAddTask(e.target.value)}
        />
        <button className="add-btn" onClick={add}>Add</button>
      </div>

      {/* SEARCH */}
      <div className="input-section">
        <input
          placeholder="Search Task"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
      </div>

      {/* FILTER BUTTONS */}
      <div className="input-section">

        <button onClick={() => setFilter("all")}>
          All
        </button>

        <button onClick={() => setFilter("active")}>
          Active
        </button>

        <button onClick={() => setFilter("completed")}>
          Completed
        </button>

      </div>

      {/* TASK LIST */}
      <div>

        {filteredTasks.map((task, index) => (
          <div className="task-item" key={index}>

            {
              index === i ? (
                <input
                  value={e}
                  onChange={(e) => setEditTask(e.target.value)}
                />
              ) : (
                <span className={task.completed ? "completed" : ""}>
                  {task.text}
                </span>
              )
            }

            <div className="btn-group">

              <button className="done-btn" onClick={() => toggleComplete(index)}>
                {task.completed ? "Undo" : "Done"}
              </button>

              <button className="delete-btn" onClick={() => del(index)}>
                Delete
              </button>

              {
                index === i ? (
                  <button onClick={save}>Save</button>
                ) : (
                  <button onClick={() => edit(index)}>Edit</button>
                )
              }

            </div>

          </div>
        ))}

      </div>
    </>
  );
}

const container = document.querySelector(".js-container");
ReactDOM.createRoot(container).render(<TodoApp />);

</script>

</body>
</html>
